name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest

    defaults:
      run:
        working-directory: app
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      npm_config_registry: https://registry.npmmirror.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Rebuild native dependencies for Electron
        run: npm run rebuild:electron

      - name: Check repository hygiene
        run: npm run check:repo

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Typecheck storage and IPC contracts
        run: npm run typecheck

      - name: Check file size policy
        run: npm run check:size

      - name: Run self-check
        run: npm run self-check

      - name: Run unit and integration tests
        run: npm run test --if-present

      - name: Run SQLite runtime acceptance
        run: npm run db:test-runtime
