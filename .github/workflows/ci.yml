name: CI

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest

    defaults:
      run:
        working-directory: app
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      npm_config_registry: https://registry.npmmirror.com

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check release version consistency
        run: npm run check:version

      - name: Install dependencies
        run: npm run ci:install

      - name: Prepare Electron runtime and native dependencies
        run: npm run prepare:electron

      - name: Check repository hygiene
        run: npm run check:repo

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Typecheck storage, Electron, and renderer contracts
        run: npm run typecheck

      - name: Check file size policy
        run: npm run check:size

      - name: Run self-check
        run: npm run self-check

      - name: Run unit and integration tests
        run: npm run test --if-present

      - name: Run SQLite runtime acceptance
        run: npm run db:test-runtime

  site:
    name: Site verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Build and validate site
        run: npm run check

      - name: Run site tests
        run: npm test
