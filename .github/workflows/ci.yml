name: CI

on:
  push:
    branches:
      - main
      - desktop/main
      - web/main
      - admin/foundation
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - desktop/main
      - web/main
      - admin/foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    if: github.ref_name != 'admin/foundation' && github.base_ref != 'admin/foundation'

    defaults:
      run:
        working-directory: app
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      npm_config_registry: https://registry.npmmirror.com

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check release version consistency
        run: npm run check:version

      - name: Install dependencies
        run: npm run ci:install

      - name: Install management dependencies
        run: npm --prefix ../admin ci --ignore-scripts --no-audit --fund=false

      - name: Prepare Electron runtime and native dependencies
        run: npm run prepare:electron

      - name: Check repository hygiene
        run: npm run check:repo

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Typecheck storage, Electron, and renderer contracts
        run: npm run typecheck

      - name: Check file size policy
        run: npm run check:size

      - name: Run self-check
        run: npm run self-check

      - name: Run unit and integration tests
        run: npm run test --if-present

      - name: Check management authorization contracts
        run: npm --prefix ../admin run check

      - name: Run SQLite runtime acceptance
        run: npm run db:test-runtime

      - name: Build shared browser renderer
        run: npm run build:renderer

      - name: Check initial client bundle budget
        run: npm run check:bundle

      - name: Build browser workspace site bundle
        run: npm --prefix ../site run build

      - name: Run hidden browser workspace acceptance
        run: npm run smoke:web

      - name: Run three-domain visual regression
        run: npm run visual:check

  site:
    name: Site verification
    runs-on: ubuntu-latest
    if: github.ref_name != 'admin/foundation' && github.base_ref != 'admin/foundation'

    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            admin/package-lock.json
            site/package-lock.json

      - name: Install browser renderer dependencies
        working-directory: app
        run: npm run ci:install

      - name: Install management dependencies
        working-directory: admin
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Build shared browser renderer
        working-directory: app
        run: npm run build:renderer

      - name: Check initial client bundle budget
        working-directory: app
        run: npm run check:bundle

      - name: Install site dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Check management authorization contracts
        working-directory: admin
        run: npm run check

      - name: Build and validate production site entry
        working-directory: ${{ github.workspace }}
        run: npm run build

      - name: Run site tests
        run: npm test

  admin:
    name: Management foundation verification
    runs-on: ubuntu-latest
    if: github.ref_name == 'admin/foundation' || github.base_ref == 'admin/foundation'

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install management contract dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Check owner-only authorization contracts
        run: npm run check
